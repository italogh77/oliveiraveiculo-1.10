        "@context": "https://schema.org",

        "address": {

          "streetAddress": "Rodovia Amaral Peixoto (RJ-106)",

          "addressRegion": "RJ",
          "addressCountry": "BR"
        },

  <body>
    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,sans-serif;">
        <style>
          @keyframes initialPulse {
            0% { transform: scale(0.97); filter: drop-shadow(0 0 10px rgba(207, 141, 60, 0.65)) drop-shadow(0 0 25px rgba(207, 141, 60, 0.4)) brightness(1.04); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(207, 141, 60, 1)) drop-shadow(0 0 48px rgba(207, 141, 60, 0.8)) brightness(1.18); }
          }
          .initial-logo-pulse {
            animation: initialPulse 0.6s ease-in-out infinite alternate;
          }
          @keyframes initialPing {
            0% { transform: scale(1); opacity: 1; }
            75%, 100% { transform: scale(2); opacity: 0; }
          }
        </style>
        <img src="%BASE_URL%logo-dark.png" alt="Oliveira Veículos" class="initial-logo-pulse" style="height:72px;max-width:280px;object-fit:contain;" />

          <span style="width:6px;height:6px;border-radius:50%;background:#cf8d3c;animation:initialPing 1.2s cubic-bezier(0,0,0.2,1) infinite;"></span>
          <span style="font-size:11px;font-family:monospace;letter-spacing:0.2em;text-transform:uppercase;color:rgba(207,141,60,0.9);font-weight:600;">Oliveira Veículos</span>
